[workspace.package]
version = "0.1.13"
edition = "2024"
repository = "https://github.com/XiangpengHao/liquid-cache"
authors = ["XiangpengHao <xiangpeng.hao@wisc.edu>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
description = "10x lower latency for cloud-native DataFusion"


[workspace]
members = [
	"src/common",
	"src/core",
	"src/datafusion",
]
resolver = "3"

[workspace.dependencies]
liquid-cache-datafusion-server = { path = "src/datafusion-server", version = "0.1.13" }
liquid-cache-datafusion-client = { path = "src/datafusion-client", version = "0.1.13" }
liquid-cache-datafusion = { path = "src/datafusion", version = "0.1.13" }
liquid-cache-common = { path = "src/common", version = "0.1.13" }
liquid-cache = { path = "src/core", version = "0.1.13" }
liquid-cache-datafusion-local = { path = "src/datafusion-local", version = "0.1.13" }
arrow = { version = "60.1.0", default-features = false, features = [
	"prettyprint",
	"ipc",
] }
arrow-flight = { version = "60.1.0", features = ["flight-sql"] }
arrow-schema = { version = "60.1.0", features = ["serde"] }
parquet = { version = "60.1.0", features = [
	"async",
	"experimental",
	"variant_experimental",
] }
parquet-variant-json = { version = "60.1.0" }
datafusion = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
datafusion-datasource = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
datafusion-common = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
datafusion-expr-common = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
datafusion-physical-expr = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
datafusion-proto = { git = "https://github.com/bonchief/datafusion.git", rev = "a34af9e14b6db55ff1e453b6a1432679785c9dc4" }
async-trait = "0.1.89"
futures = { version = "0.3.32", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
log = "0.4.32"
tonic = { version = "0.14.6" }
url = "2.5.8"
bytes = { version = "1.11.1", default-features = false }
ahash = "0.8.12"
prost = "0.14.4"
object_store = { version = "0.14.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
uuid = { version = "1.23.3", features = ["v4"] }
fastrace = "0.7"
fastrace-tonic = "0.2"
congee = "0.4.1"
insta = { version = "1.47.2", features = ["filters"] }
t4 = { version = "0.1.9", default-features = false }
vortex-array = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-arrow = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-btrblocks = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-ipc = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-buffer = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-mask = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-session = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-error = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-fastlanes = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-fsst = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-alp = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-runend = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-sparse = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-zigzag = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-datetime-parts = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-decimal-byte-parts = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-bytebool = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }
vortex-sequence = { git = "file:///tmp/reference-repos/vortex-bonchief", rev = "a36060752c9b641b29213e65dbd76e7ec1686935", default-features = false }

[profile.dev.package]
insta.opt-level = 3
